<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-labelledby="ttl">
  <title id="ttl">GitOps repo layout and how ArgoCD turns it into running namespaces</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <style>
      text{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .t{font-size:14px;font-weight:600;fill:#0f172a}
      .s{font-size:11px;fill:#64748b}
      .f{font-size:11px;fill:#334155}
      .l{font-size:11px;font-weight:500;fill:#475569}
      .h{font-size:22px;font-weight:700;fill:#0f172a}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:5 4}
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1238.5" height="618.5" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="42" class="h">cicd-crud-gitops · desired state</text>
  <text x="30" y="64" class="s" style="font-size:12px">Git is the source of truth: ArgoCD makes the cluster match branch main.</text>

  <!-- Jenkins -->
  <rect class="box" x="24" y="365" width="120" height="70" rx="10"/>
  <rect x="38" y="377" width="28" height="4" rx="2" fill="#dc2626"/>
  <text x="38" y="406" class="t">Jenkins</text>
  <text x="38" y="423" class="s">webapp repo</text>
  <path class="ln" d="M144 400 H198"/>
  <text x="172" y="390" class="l" text-anchor="middle">newTag</text>

  <!-- repo card -->
  <rect x="200" y="90" width="380" height="490" rx="14" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="220" y="116" class="t">Repository · branch main</text>

  <rect x="214" y="128" width="352" height="92" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="230" y="150" class="t mono" style="font-size:13px">argocd/</text>
  <text x="230" y="170" class="f mono">app-dev.yaml · app-prod.yaml</text>
  <text x="230" y="190" class="s">One ArgoCD Application per env: which path to</text>
  <text x="230" y="205" class="s">watch and where to deploy it.</text>

  <rect x="214" y="240" width="352" height="92" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="230" y="262" class="t mono" style="font-size:13px">app/base/</text>
  <text x="230" y="282" class="f mono">deployment.yaml · service.yaml</text>
  <text x="230" y="302" class="s">Env-neutral manifests. The image is a</text>
  <text x="230" y="317" class="s">placeholder name, each overlay fills it in.</text>

  <rect x="214" y="352" width="352" height="96" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="230" y="374" class="t mono" style="font-size:13px">app/overlays/dev | prod/</text>
  <text x="230" y="394" class="f mono">kustomization.yaml · config.js</text>
  <text x="230" y="410" class="f mono">ingress.yaml · namespace.yaml</text>
  <text x="230" y="431" class="s">Extends base: real image + newTag, host, config.</text>

  <rect x="214" y="468" width="352" height="96" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="230" y="490" class="t mono" style="font-size:13px">infra/</text>
  <text x="230" y="510" class="f mono">cluster-issuer.yaml · argocd-ingress.yaml</text>
  <text x="230" y="531" class="s">Cluster-wide pieces (Let's Encrypt issuer, ArgoCD</text>
  <text x="230" y="546" class="s">UI ingress). Not watched by ArgoCD: apply by hand.</text>

  <!-- rollback note -->
  <rect x="660" y="90" width="230" height="74" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="676" y="114" class="t" style="font-size:13px;fill:#3730a3">Rollback</text>
  <text x="676" y="134" class="s" style="font-size:12px;fill:#475569">git revert the deploy(env)</text>
  <text x="676" y="150" class="s" style="font-size:12px;fill:#475569">commit and ArgoCD follows.</text>

  <!-- ArgoCD -->
  <rect class="box" x="660" y="210" width="230" height="190" rx="12"/>
  <rect x="674" y="222" width="28" height="4" rx="2" fill="#0d9488"/>
  <text x="674" y="252" class="t" style="font-size:16px">ArgoCD</text>
  <text x="674" y="274" class="s" style="font-size:12px;fill:#475569">kustomize build per overlay,</text>
  <text x="674" y="291" class="s" style="font-size:12px;fill:#475569">then apply the diff.</text>
  <text x="674" y="320" class="f" style="font-size:12px"><tspan font-weight="600">automated</tspan> sync on every commit</text>
  <text x="674" y="342" class="f" style="font-size:12px"><tspan font-weight="600">prune</tspan> deleted in Git = deleted</text>
  <text x="674" y="364" class="f" style="font-size:12px"><tspan font-weight="600">selfHeal</tspan> manual edits reverted</text>
  <text x="674" y="386" class="f" style="font-size:12px"><tspan font-weight="600">CreateNamespace</tspan> on first sync</text>

  <!-- infra pill -->
  <rect class="box" x="660" y="470" width="230" height="94" rx="12"/>
  <rect x="674" y="482" width="28" height="4" rx="2" fill="#d97706"/>
  <text x="674" y="511" class="t">cert-manager + ArgoCD UI</text>
  <text x="674" y="531" class="s">kubectl apply by hand, once</text>
  <text x="674" y="547" class="s">argocd.chollosfuentealamo.com</text>

  <!-- namespaces -->
  <g>
    <rect x="960" y="90" width="250" height="236" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="978" y="118" class="t" style="fill:#9a3412">chollos-dev</text>
    <text x="978" y="135" class="s mono" style="font-size:10px">dev.chollosfuentealamo.com</text>
    <rect x="976" y="150" width="218" height="28" rx="8" fill="#fff" stroke="#fdba74"/><text x="988" y="168" class="f">Ingress · TLS from cert-manager</text>
    <rect x="976" y="184" width="218" height="28" rx="8" fill="#fff" stroke="#fdba74"/><text x="988" y="202" class="f">Service web :80</text>
    <rect x="976" y="218" width="218" height="28" rx="8" fill="#fff" stroke="#fdba74"/><text x="988" y="236" class="f">Deployment web · nginx pod</text>
    <rect x="976" y="252" width="218" height="28" rx="8" fill="#fff" stroke="#fdba74"/><text x="988" y="270" class="f mono" style="font-size:10.5px">ConfigMap → /config.js</text>
    <text x="978" y="304" class="s">banner on · orange</text>
  </g>
  <g>
    <rect x="960" y="354" width="250" height="236" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="978" y="382" class="t" style="fill:#166534">chollos-prod</text>
    <text x="978" y="399" class="s mono" style="font-size:10px">chollosfuentealamo.com</text>
    <rect x="976" y="414" width="218" height="28" rx="8" fill="#fff" stroke="#86efac"/><text x="988" y="432" class="f">Ingress · TLS from cert-manager</text>
    <rect x="976" y="448" width="218" height="28" rx="8" fill="#fff" stroke="#86efac"/><text x="988" y="466" class="f">Service web :80</text>
    <rect x="976" y="482" width="218" height="28" rx="8" fill="#fff" stroke="#86efac"/><text x="988" y="500" class="f">Deployment web · nginx pod</text>
    <rect x="976" y="516" width="218" height="28" rx="8" fill="#fff" stroke="#86efac"/><text x="988" y="534" class="f mono" style="font-size:10.5px">ConfigMap → /config.js</text>
    <text x="978" y="568" class="s">banner off · green</text>
  </g>

  <!-- arrows -->
  <path class="ln dash" d="M660 290 C625 290 610 180 566 180"/>
  <path class="ln dash" d="M660 340 C625 340 610 400 566 400"/>
  <path class="ln" d="M890 270 C925 270 925 208 960 208"/>
  <path class="ln" d="M890 340 C925 340 925 472 960 472"/>
  <path class="ln dash" d="M566 516 H660"/>

  <text x="618" y="204" class="l" text-anchor="end">watches</text>
  <text x="650" y="384" class="l" text-anchor="end">reads</text>
  <text x="925" y="300" class="l" text-anchor="middle">sync</text>
  <text x="613" y="506" class="l" text-anchor="middle">manual</text>

  <text x="30" y="600" class="s">Dashed arrow = ArgoCD pulling from Git (or a manual step) · solid arrow = ArgoCD applying to the cluster</text>
</svg>
