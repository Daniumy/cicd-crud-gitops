apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chollos-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Daniumy/cicd-crud-gitops.git
    targetRevision: main
    path: app/overlays/prod          # ArgoCD detecta solo que es Kustomize
  destination:
    server: https://kubernetes.default.svc   # "este mismo cluster"
    namespace: chollos-prod
  syncPolicy:
    automated:
      prune: true        # si borras algo de Git, bórralo del cluster
      selfHeal: true     # si alguien toca el cluster a mano, vuelve a lo que dice Git
    syncOptions:
      - CreateNamespace=true